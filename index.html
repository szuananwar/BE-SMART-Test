      <div class="subgrid">
        <section class="card"><div class="card-title"><h3>What the team must do and verify</h3><span>${prog.done} / ${prog.total} required</span></div>
          <div class="stage-meter"><div class="progress-top"><span>Checklist progress</span><strong>${prog.pct}%</strong></div><div class="progress-track"><div class="progress-fill" style="width:${prog.pct}%"></div></div></div>
          <div class="checkgroup">${s.tasks.map(t=>{const checked=Boolean(d.checked[t[0]]);return `<label class="check-item ${checked?'done':''}"><input type="checkbox" data-stage-check="${s.id}" data-check-id="${t[0]}" ${checked?'checked':''}><span class="check-text"><span class="check-title">${esc(t[1])}</span><span class="check-desc">${esc(t[2])}</span></span><span class="check-meta ${t[3]?'required':''}">${t[3]?'Core':'Extra'}</span></label>`;}).join('')}</div>
        </section>
        <section class="card"><div class="card-title"><h3>Stage quality self-rubric</h3><span>1 = weak · 5 = excellent</span></div><p class="tiny" style="line-height:1.7;margin-bottom:12px">These are PSU coaching scores to help the team improve its work. They do not add Theatre points or replace PERFCT judges' scores.</p>
          ${s.rubric.map(x=>`<div class="rubric-item"><div><strong>${esc(x[1])}</strong><p>${esc(x[2])}</p></div><select class="rating rubric-rating" aria-label="Rate ${esc(x[1])}" data-stage-rating="${s.id}" data-rubric-id="${x[0]}"><option value="0" ${!d.ratings[x[0]]?'selected':''}>Not rated</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${d.ratings[x[0]]===n?'selected':''}>${n}/5</option>`).join('')}</select></div>`).join('')}
          <div class="highlight-panel"><strong>What judges should be able to inspect</strong><p>${esc(s.reminder)}</p></div>
        </section>
      </div>
      <div class="section-heading"><div><h2>Evidence and handoff</h2><p>Save concise proof of your work. Do not enter sensitive or proprietary information.</p></div><span class="tag">Saved locally</span></div>
      <div class="card"><div class="field"><label class="label" for="evidence-${s.id}">Stage evidence / key decisions</label><textarea class="textarea" id="evidence-${s.id}" style="min-height:130px" data-stage-field="${s.id}" data-field="evidence" placeholder="${esc(s.evidencePrompt)}">${esc(d.evidence)}</textarea></div>
        <div class="two-fields"><div class="field"><label class="label" for="link-${s.id}">SymStudio or artifact URL (optional)</label><input class="input" id="link-${s.id}" data-stage-field="${s.id}" data-field="link" value="${esc(d.link)}" placeholder="https://..."></div><div class="field"><label class="label" for="coach-${s.id}">Toyota coach feedback</label><textarea class="textarea" id="coach-${s.id}" style="min-height:70px" data-stage-field="${s.id}" data-field="coach" placeholder="${esc(s.coachPrompt)}">${esc(d.coach)}</textarea></div></div>
        <div class="intro-actions" style="margin-top:5px"><button type="button" class="btn btn-ghost" data-action="copy-stage" data-stage="${s.id}">Copy this stage summary</button>${prev?`<a class="btn btn-ghost" href="#${prev.id}">← ${esc(prev.name)}</a>`:`<a class="btn btn-ghost" href="#problems">← Problem selection</a>`}<a class="btn btn-primary" href="${next?'#'+next.id:'#ready'}">${next?'Continue to '+esc(next.name):'Review final readiness'} →</a></div>
      </div>
      ${stageMentorPanel(s)}`;
  }
  function readinessPage(){const overall=overallProgress();const readyTotal=READINESS.reduce((n,g)=>n+g.items.length,0);const readyDone=READINESS.reduce((n,g)=>n+g.items.filter(t=>state.readiness[g.id+':'+t[0]]).length,0);
    return `<div class="page-intro"><div><div class="eyebrow">Final checkpoint · Judge and submission readiness</div><h1>Make the next decision easy.</h1><p class="lead">A technically credible product, an inspectable SymStudio journey, and a decision-ready presentation. Confirm every official submission requirement before the six-hour deadline.</p></div><div class="intro-actions"><button type="button" class="btn btn-ghost" data-action="export-md">Download report ↓</button><button type="button" class="btn btn-primary" data-action="export-json">Backup progress ↓</button></div></div>
      ${notice}
      <div class="stats">
        <div class="stat"><div class="stat-k">Competition problem</div><div class="stat-v small">${state.selected===null?'Not selected':esc(state.problems[state.selected].title)}</div><div class="stat-foot">Selection score: ${state.selected===null?'—':fmt(problemScore(state.selected))+'/100'} (coaching only)</div></div>
        <div class="stat"><div class="stat-k">Required stage checks</div><div class="stat-v green">${overall.done}<span class="tiny"> / ${overall.total}</span></div><div class="stat-foot">${overall.pct}% completed across five stages</div></div>
        <div class="stat"><div class="stat-k">Final readiness checks</div><div class="stat-v amber">${readyDone}<span class="tiny"> / ${readyTotal}</span></div><div class="stat-foot">Technical, decision, and submission checks</div></div>
        <div class="stat"><div class="stat-k">Official judging</div><div class="stat-v small">17 criteria</div><div class="stat-foot">Full official detailed rubric not entered here</div></div>
      </div>
      <div class="section-heading"><div><h2>SymStudio stage completion</h2><p>Click a stage to finish missing evidence or self-ratings.</p></div></div>
      <div class="card">${STAGES.map(s=>{const p=stageProgress(s),r=stageRating(s);return `<div class="stage-row"><a class="stage-name link" href="#${s.id}">${s.num} · ${esc(s.name)} ↗</a><span class="tiny">${r.avg===null?'Not rated':r.avg.toFixed(2)+'/5'}</span><div class="mini-track"><span style="width:${p.pct}%"></span></div><span class="pct">${p.pct}%</span></div>`}).join('')}</div>
      <div class="mentor-hero"><span class="tag mint">New · Complete product coaching</span><h2>Review the expert blueprint and rehearse the Room.</h2><p>Compare your answers against illustrative solutions, validate the MVP with the UX lab, and use a short user-centered acted scenario or original video without losing technical credibility.</p><div class="mentor-actions"><a class="btn btn-primary" href="#blueprint">Coach Blueprint →</a><a class="btn" href="#prototype">Build & UX Lab →</a><a class="btn" href="#pitch">Pitch Studio →</a></div></div>
      <div class="section-heading"><div><h2>Judging and submission checks</h2><p>These are practical preparation targets; follow the actual event checklist if it differs.</p></div></div>
      <div class="readiness-grid">${READINESS.map(g=>{const gDone=g.items.filter(t=>state.readiness[g.id+':'+t[0]]).length;return `<section class="card"><div class="card-title"><h3>${esc(g.name)}</h3><span>${gDone}/${g.items.length}</span></div><p class="tiny" style="line-height:1.65;margin-bottom:14px">${esc(g.description)}</p><div class="checkgroup">${g.items.map(t=>{const checked=state.readiness[g.id+':'+t[0]];return `<label class="check-item ${checked?'done':''}"><input type="checkbox" data-ready-group="${g.id}" data-ready-item="${t[0]}" ${checked?'checked':''}><span class="check-text"><span class="check-title">${esc(t[1])}</span></span></label>`;}).join('')}</div></section>`}).join('')}</div>
      <div class="section-heading"><div><h2>Six-hour execution timeline</h2><p>Adjust based on the organizer's real submission and judging schedule.</p></div></div>
      <div class="timeline"><div class="time-step"><strong>0:00–0:20</strong><span>Compare 3 problems and select the official challenge.</span></div><div class="time-step"><strong>0:20–1:25</strong><span>Empathy → Shape in SymStudio; produce a build-ready PRD.</span></div><div class="time-step"><strong>1:25–4:20</strong><span>Build one complete MVP workflow and integrate core data/API.</span></div><div class="time-step"><strong>4:20–5:20</strong><span>Test real inputs, error states, deployment, and backup.</span></div><div class="time-step"><strong>5:20–6:00</strong><span>Rehearse, deliver a decision-ready pitch, and submit on time.</span></div></div>
      <div class="section-heading"><div><h2>Final team notes</h2><p>Track the remaining blocker, the responsible teammate, and the pitch's decision ask.</p></div></div>
      <div class="card"><label class="label" for="general-notes">Outstanding actions / decisions</label><textarea class="textarea" id="general-notes" style="min-height:135px" data-general-notes placeholder="Owner + action + due time; most serious remaining risk; approval/pilot request...">${esc(state.generalNotes)}</textarea><div class="intro-actions" style="margin-top:14px"><button type="button" class="btn btn-primary" data-action="export-md">Download shareable summary (.md)</button><button type="button" class="btn" data-action="export-json">Export backup (.json)</button><button type="button" class="btn btn-ghost" data-action="print">Print this checklist</button></div></div>
      <p class="footnote">From the example PERFCT judging screen, The Build was shown at 35% and The Loop at 25%. Other category weights and all 17 exact criterion names were not established. This site intentionally does not manufacture those missing facts. The Theatre leaderboard is a separate engagement measure.</p>`;
  }
  function render(restore=false){const y=restore?window.scrollY:0;renderNav();const page=currentPage();const s=STAGES.find(x=>x.id===page);document.getElementById('app-content').innerHTML=page==='problems'?problemPage():page==='blueprint'?coachPage():page==='prototype'?uxPage():page==='pitch'?pitchPage():page==='ready'?readinessPage():stagePage(s); if(restore)window.scrollTo(0,y); else window.scrollTo({top:0,behavior:'instant'});}
  function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2600);}
  function dl(filename,contents,type){const url=URL.createObjectURL(new Blob([contents],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
  function makeReport(){let lines=['# PSU Panthers — Hackathon Coaching Report','',`Generated: ${new Date().toLocaleString()}`,'','> Coaching rubric only. Not the official PERFCT score, SymStudio Theatre score, or official submission.','','## Challenge Selection'];
    state.problems.forEach((p,i)=>{lines.push('',`### ${p.title} — ${fmt(problemScore(i))}/100`,p.brief||'(Statement not recorded)',p.notes?'Coach notes: '+p.notes:'',...FACTORS.map((f,j)=>`- ${f.label}: ${p.ratings[j]}/5 (${f.weight}% weight)`));});
    lines.push('','**Chosen challenge:** '+(state.selected===null?'Not selected':state.problems[state.selected].title),'');
    STAGES.forEach(s=>{const d=state.stages[s.id],prog=stageProgress(s),r=stageRating(s);lines.push(`## ${s.num}. ${s.name}`,`Required checklist: ${prog.done}/${prog.total}`,`Coach self-rating: ${r.avg===null?'not rated':r.avg.toFixed(2)+'/5'} (${r.n}/${r.total} scored)`,'','### Checklist',...s.tasks.map(t=>`- [${d.checked[t[0]]?'x':' '}] ${t[1]}${t[3]?' [core]':''}`),'','### Self-rating',...s.rubric.map(x=>`- ${x[1]}: ${d.ratings[x[0]]?d.ratings[x[0]]+'/5':'Not rated'}`),'','### Evidence',d.evidence||'(not recorded)','',`Artifact URL: ${d.link||'(not recorded)'}`,'',`Toyota coach: ${d.coach||'(not recorded)'}`,'');});
    lines.push('## Final Readiness');READINESS.forEach(g=>{lines.push('',`### ${g.name}`,...g.items.map(t=>`- [${state.readiness[g.id+':'+t[0]]?'x':' '}] ${t[1]}`));});    lines.push('','## Student vs mentor product comparison',`Mentor concept: ${getContext().product} — ${fmt(conceptScore(state.concept.ratingsCoach))}/100`,`Student concept: ${state.concept.name} — ${fmt(conceptScore(state.concept.ratingsTeam))}/100`,state.concept.summary,state.concept.comparison,'','## Selected problem and expert coaching','',coachTextForAll(),'','## Pitch draft','',pitchScript(getContext()),'','## Slide outline','',...slidePlan(getContext()).map(s=>s.join(' — ')),'','## Outstanding notes',state.generalNotes||'(none)','');return lines.join('\n');
  }
  async function copyText(text){try{await navigator.clipboard.writeText(text);toast('Copied to clipboard.');}catch(e){dl('psu-panthers-stage.txt',text,'text/plain');toast('Downloaded text instead of copying.');}}

  document.addEventListener('input',e=>{const el=e.target;
    if(el.matches('[data-problem][data-field]')){const i=Number(el.dataset.problem);state.problems[i][el.dataset.field]=el.value;save();}
    else if(el.matches('[data-stage-field]')){state.stages[el.dataset.stageField][el.dataset.field]=el.value;save();}
    else if(el.matches('[data-profile-field]')){if(state.selected!==null){state.profiles[state.selected][el.dataset.profileField]=el.value;save();}}
    else if(el.matches('[data-team-field]')){state.teamWork[el.dataset.teamField][el.dataset.field]=el.value;save();}
    else if(el.matches('[data-pitch-field]')){state.pitch[el.dataset.pitchField]=el.value;save();}
    else if(el.matches('[data-concept-field]')){state.concept[el.dataset.conceptField]=el.value;save();}
    else if(el.matches('[data-general-notes]')){state.generalNotes=el.value;save();}
  });
  document.addEventListener('change',e=>{const el=e.target;
    if(el.matches('[data-score-problem]')){state.problems[Number(el.dataset.scoreProblem)].ratings[Number(el.dataset.scoreFactor)]=Number(el.value);save();render(true);}
    else if(el.matches('[data-stage-check]')){state.stages[el.dataset.stageCheck].checked[el.dataset.checkId]=el.checked;save();render(true);}
    else if(el.matches('[data-stage-rating]')){state.stages[el.dataset.stageRating].ratings[el.dataset.rubricId]=Number(el.value);save();render(true);}
    else if(el.matches('[data-ready-group]')){state.readiness[el.dataset.readyGroup+':'+el.dataset.readyItem]=el.checked;save();render(true);}
    else if(el.matches('[data-concept-rating]')){state.concept[el.dataset.conceptRating==='coach'?'ratingsCoach':'ratingsTeam'][Number(el.dataset.conceptFactor)]=Number(el.value);save();render(true);}
    else if(el.matches('[data-profile-field]')){save();render(true);}
    else if(el.matches('[data-problem][data-field="title"]')){render(true);}
  });
  document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;
    if(action==='choose-problem'){state.selected=Number(el.dataset.index);save();render(true);toast('Challenge selected. Validate with the Toyota coach.');}
    else if(action==='export-json'){dl('psu-panthers-progress.json',JSON.stringify(state,null,2),'application/json');toast('Progress backup downloaded.');}
    else if(action==='import-json'){document.getElementById('import-file').click();}
    else if(action==='export-md'){dl('psu-panthers-team-report.md',makeReport(),'text/markdown;charset=utf-8');toast('Team report downloaded.');}
    else if(action==='copy-stage'){const s=STAGES.find(x=>x.id===el.dataset.stage),d=state.stages[s.id];const txt=[s.name,s.output,'Checklist:',...s.tasks.map(t=>`${d.checked[t[0]]?'✓':'○'} ${t[1]}`),'Evidence:',d.evidence||'(none)','Artifact:',d.link||'(none)','Toyota coach feedback:',d.coach||'(none)'].join('\n');await copyText(txt);}
    else if(action==='refresh-coach'){save();render(true);toast('Coach examples and review refreshed.');}
    else if(action==='copy-coach-prompt'){await copyText(guideFor(el.dataset.stage,getContext()).prompt);}
    else if(action==='copy-coach-stage'){await copyText(guideFor(el.dataset.stage,getContext()).model);}
    else if(action==='copy-all-coach'){await copyText(coachTextForAll());}
    else if(action==='copy-review'){await copyText(reviewPrompt(el.dataset.stage));}
    else if(action==='copy-builder'){const c=getContext();const txt=`Build a responsive MVP for ${c.title}. Exact problem: ${c.brief}. Primary user: ${c.user}. Job: ${c.goal}. Product: ${c.product}, ${c.feature}. Create four functional screens: intake, comparison, detail/decision, confirmation. Each screen has one primary action and a visible next step. Use labeled sample data: ${c.domain.data}. Core journey: ${c.domain.action} and ${c.domain.result}. Include invalid input, no-result, and completed states. Avoid proprietary APIs, invented live information, secrets, nonessential authentication and payments. Explainable rules, accessible layout, responsive design, a README and testable acceptance checks. Limitation: ${c.domain.risk}. Style inspiration may contribute colors/fonts/spacing only: never copy logos or text.`; await copyText(txt);}
    else if(action==='copy-style'){await copyText('Use visual inspiration ONLY for colors, font hierarchy, spacing and overall mood. Keep our existing app layout, every functional feature and content hierarchy. Do not copy logos, text, brand identities or unrelated animations. Use subtle fade-in and staggered slide-up where useful, preserve keyboard accessibility and reduced-motion support.');}
    else if(action==='pitch-style'){state.pitch.style=el.dataset.style;save();render(true);}
    else if(action==='copy-pitch'){await copyText(pitchScript(getContext()));}
    else if(action==='copy-slides'){await copyText(slidePlan(getContext()).map(s=>s.join(' — ')).join('\n'));}
    else if(action==='reset'){if(confirm('Reset all three problem ratings, stage checklists, and notes on THIS DEVICE? Export a JSON backup first if you might need this data.')){state=fresh();save();navigate('problems');render();toast('Practice data reset.');}}
    else if(action==='print'){window.print();}
  });
  document.getElementById('import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const text=await file.text();const imported=validData(JSON.parse(text));if(!confirm('Replace progress on this device with the imported backup?'))return;state=imported;save();render(true);toast('Progress imported successfully.');}catch(err){alert('Could not import file: '+err.message);}finally{e.target.value='';}});
  window.addEventListener('hashchange',()=>render());
  save();render();
})();
</script>
</body>
</html>
